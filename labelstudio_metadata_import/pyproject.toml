[project]
name = "labelstudio-metadata-import"
version = "0.1.0"
description = "Run Glaswacht headlessly and import the results into Label Studio."
readme = "README.md"
authors = [
    { name = "LBT-H", email = "basvercruysse@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "click>=8.3.1",
    "requests>=2.32.0",
    "risk-assessment",
]

[tool.uv.sources]
risk-assessment = { workspace = true }

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"
