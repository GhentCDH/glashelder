name: CI

on:
  # other branches are checked through their pull request, so a commit runs once
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# a new commit on the same branch (or pull request) cancels the run still going
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Lint
        run: uvx ruff check

      - name: Format check
        run: uvx ruff format --check

      - name: Example config check
        run: uv run --package common python -m common.config_example example --check
