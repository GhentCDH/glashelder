[project]
name = "ocr"
version = "0.1.0"
description = "OCR pipeline for extracting text from within photo's and labels on the glassplates"
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [
  { name = "Miel Peeters", email = "peetersmiel@gmail.com" },
  { name = "LBT-H", email = "basvercruysse@gmail.com" }
]
dependencies = [
  "click>=8.3.1",
  "rapidfuzz>=3.14.5",
  "common",
  "preprocessing",
  "rich>=14.3.2",
  "pillow>=12.1.1",
]

[build-system]
requires = ["uv_build>=0.9.14,<0.13"]
build-backend = "uv_build"
