repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  # ruff version
  rev: v0.14.14
  hooks:
    - id: ruff-check
      args: [--fix]
    - id: ruff-format
- repo: local
  hooks:
    - id: example-config
      name: glashelder.example.toml matches the config defaults
      entry: uv run glashelder config example --check
      language: system
      files: ^(glashelder\.example\.toml|common/src/common/config(_example)?\.py)$
      pass_filenames: false
