[package]
name = "unstirring"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "time"] }
reqwest = { version = "0.13", features = ["rustls", "query", "json"] }
anyhow = "1.0.105"
futures = "0.3.34"
bytes = "1.12.2"
viuer = "0.11.0"
image = "0.25.10"
governor = "0.10.4"
http = "1.5.0"
bulb-dither = "6.1.0"
