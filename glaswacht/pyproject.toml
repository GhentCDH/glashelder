[project]
name = "glaswacht"
version = "0.1.0"
description = "Vision model ensemble that flags glass plate photos for review."
readme = "README.md"
authors = [
    { name = "LBT-H", email = "basvercruysse@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "accelerate>=1.12.0",
    "bitsandbytes>=0.49.1",
    "click>=8.3.1",
    "common",
    "flask>=3.0.0",
    "pillow>=10.0.0",
    "textual>=7.5.0",
    "torch>=2.6.0",
    "torchvision>=0.24.1",
    "transformers>=5.1.0",
]

[project.scripts]
glaswacht = "glaswacht.cli:glaswacht"

[project.optional-dependencies]
gpu = [
    "ninja>=1.13.0",
]

[build-system]
requires = ["uv_build>=0.9.14,<0.13"]
build-backend = "uv_build"
