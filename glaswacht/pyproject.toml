[project]
name = "glaswacht"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "LBT-H", email = "basvercruysse@gmail.com" }
]
requires-python = "==3.13.*"
dependencies = [
    "accelerate>=1.12.0",
    "bitsandbytes>=0.49.1",
    "click>=8.3.1",
    "common",
    "flask>=3.0.0",
    "pillow>=10.0.0",
    "textual>=7.5.0",
    "torchvision>=0.24.1",
    "transformers==5.1.0",
]

[project.scripts]
glaswacht = "glaswacht.cli:glaswacht"

[tool.uv.sources]
common = { workspace = true }

[project.optional-dependencies]
gpu = [
    "ninja>=1.13.0",
]

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"
