[project]
name = "glashelder"
version = "2.0.0"
readme = "README.md"
description = "Experiments for the glashelder AI workflows"
requires-python = ">=3.13,<3.14"
authors = [
    { name = "Miel Peeters", email = "peetersmiel@gmail.com" },
    { name = "Bas Vercruysse", email = "bas.vercruysse@ugent.be" },
]
dependencies = [
    "common",
    "cluster",
    "glaswacht",
    "preprocessing",
    "embed",
    "artmatcher",
    "artscraper",
    "ocr",
    "click>=8.3.1",
    "python-dotenv>=1.1.0",
    "rich>=13.9.4",
]

[project.scripts]
glashelder = "glashelder:main"

[tool.uv]
python-preference = "only-managed"

[tool.uv.sources]
common = { workspace = true }
cluster = { workspace = true }
preprocessing = { workspace = true }
glaswacht = { workspace = true }
artmatcher = { workspace = true }
embed = { workspace = true }
ocr = { workspace = true }
artscraper = { workspace = true }

[tool.uv.workspace]
members = [
    "cluster",
    "common",
    "preprocessing",
    "glaswacht",
    "artmatcher",
    "embed",
    "ocr",
    "artscraper",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific rules
]
ignore = [
    "E501", # line too long (ruff format handles this)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = [
    "glashelder",
    "common",
    "cluster",
    "preprocessing",
    "artmatcher",
    "embed",
    "glaswacht",
    "ocr",
    "artscraper",
]

[tool.ty.environment]
root = [
    "common",
    "cluster",
    "preprocessing",
    "glaswacht",
    "artmatcher",
    "embed",
    "ocr",
    "artscraper",
]

[build-system]
requires = ["uv_build>=0.9.14,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.15.1",
    "ty>=0.0.85",
]
notebooks = [
    "jupyter>=1.1.1",
    "ipykernel>=6.31.0",
    "rerun-sdk>=0.27.2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
]
