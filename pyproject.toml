[project]
name = "glashelder"
version = "0.1.0"
readme = "README.md"
description = "Experiments for the glashelder AI workflows"
requires-python = ">=3.13,<3.14"
authors = [
    { name = "Miel Peeters", email = "peetersmiel@gmail.com" },
    { name = "Bas Vercruysse", email = "bas.vercruysse@ugent.be" },
]
dependencies = ["common", "clipcluster", "click>=8.3.1", "python-dotenv>=1.1.0"]

[project.scripts]
glashelder = "glashelder:main"

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
common = { workspace = true }
clipcluster = { workspace = true }
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[tool.uv.workspace]
members = ["clipcluster", "common", "classification"]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130" # adjust for your CUDA version
explicit = true
