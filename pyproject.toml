[project]
name = "glashelder"
version = "0.1.0"
readme = "README.md"
description = "Experiments for the glashelder AI workflows"
requires-python = ">=3.13,<3.14"
authors = [
    { name = "Miel Peeters", email = "peetersmiel@gmail.com" },
    { name = "Bas Vercruysse", email = "bas.vercruysse@ugent.be" },
]
dependencies = [
    "common",
    "clipcluster",
    "click>=8.3.1",
    "python-dotenv>=1.1.0",
    "opencv-python>=4.11.0.86",
    "rich>=13.9.4",
    "classification",
    "preprocessing",
    "qwenvlm",
    "workspace>=0.3.1",
    "transformers>=4.57.0",
    "pillow>=12.0.0",
    "torch>=2.6.0",
    "torchvision>=0.24.0",
    "rerun-sdk>=0.27.2",
    "jupyter>=1.1.1",
]

[project.scripts]
glashelder = "glashelder:main"

[build-system]
requires = ["uv_build>=0.9.14,<0.10.0"]
build-backend = "uv_build"

[tool.uv.sources]
common = { workspace = true }
clipcluster = { workspace = true }
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
classification = { workspace = true }
preprocessing = { workspace = true }
qwenvlm = { workspace = true }

[tool.uv.workspace]
members = [
    "clipcluster",
    "common",
    "classification",
    "preprocessing",
    "qwenvlm",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu130" # adjust for your CUDA version
explicit = true
