[project]
name = "common"
version = "0.1.0"
description = "Common reusable code for glashelder experiments"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch>=2.6.0",
    "transformers>=4.47.0",
    "pillow>=12.0.0",
    "python-dotenv>=1.1.0",
]

[dependency-groups]
dev = ["pyright>=1.1.406"]

[tool.pyright]
typeCheckingMode = "basic"
venv = ".venv"
venvPath = "."

[build-system]
requires = ["uv_build>=0.7.17,<0.8"]
build-backend = "uv_build"
