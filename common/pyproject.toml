[project]
name = "common"
version = "0.1.0"
description = "Common reusable code for glashelder experiments"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pillow>=12.0.0",
    "python-dotenv>=1.1.0",
    "httpx>=0.27",
    "click>=8.1",
    "rich>=13.0",
]

[build-system]
requires = ["uv_build>=0.7.17,<0.8"]
build-backend = "uv_build"
