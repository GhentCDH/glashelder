[project]
name = "clipcluster"
version = "0.1.0"
description = "Cluster images using CLIP embeddings."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "common",
  "numpy>=2.2.3",
  "scikit-image>=0.25.2",
  "scikit-learn>=1.6.1",
  "umap-learn>=0.5.9.post2",
  "hdbscan>=0.8.40",
  "matplotlib>=3.10.7",
  "flask>=3.1.2",
  "anywidget[dev]>=0.9.21",
]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
common = { workspace = true }

[dependency-groups]
dev = ["pyright>=1.1.406"]

[tool.pyright]
typeCheckingMode = "basic"
venv = ".venv"
venvPath = "."

[build-system]
requires = ["uv_build>=0.9.14,<0.10.0"]
build-backend = "uv_build"
