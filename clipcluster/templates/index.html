<!doctype html>
<html>
  <head>
    <title>{% block title %}CLIP Image Search{% endblock %}</title>
    <script
      src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.8/dist/htmx.min.js"
      integrity="sha384-/TgkGk7p307TH7EXJDuUlgG3Ce1UVolAOFopFekQkkXihi5u/6OCvVKyz1W+idaz"
      crossorigin="anonymous"
    ></script>
    <link
      href="{{ url_for('static', filename='css/output.css') }}"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="p-8 mb-8">
      <h1 class="font-400 text-2xl mb-4">Search in Latent Space...</h1>
      <form
        class="flex gap-4 mb-8"
        hx-post="/search"
        hx-target="#results"
        hx-indicator="#loading"
      >
        <input
          class="focus:border-red-500 focus:outline-none border-black border-2 rounded-sm flex-1 p-3"
          type="text"
          name="prompt"
          placeholder="Enter search prompt (e.g., 'a cat sitting on a chair')"
          required
          autocomplete="off"
          hx-post="/search"
          hx-trigger="input changed delay:500ms"
          hx-target="#results"
          hx-indicator="#loading"
          hx-include="[name='top_k']"
        />
        <input
          type="number"
          class="min-w-30 border-2 border-black rounded-sm p-3 focus:border-red-500 focus:outline-none"
          name="top_k"
          value="12"
          min="1"
          max="100"
          title="Number of results"
        />
        <button type="submit" class="bg-black text-white rounded-sm border-0 cursor-pointer px-3 py-2 transition-colors hover:bg-neutral-500">Search</button>
        <div id="loading" class="htmx-indicator loading">Searching...</div>
      </form>
    </div>

    <div id="results">{% block results %}{% endblock %}</div>
  </body>
</html>
