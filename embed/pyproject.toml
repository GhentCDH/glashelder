[project]
name = "embed"
version = "0.1.0"
description = "Compute and serve image embeddings for glass plate matching."
readme = "README.md"
authors = [
    { name = "Miel Peeters", email = "peetersmiel@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "common",
    "artscraper",
    "click>=8.3.1",
    "flask>=3.1.2",
    "numpy>=2.3.5",
    "rich>=14.3.2",
    "pillow>=12.1.1",
    "torch>=2.6.0",
    "transformers>=5.1.0",
]

[build-system]
requires = ["uv_build>=0.9.14,<0.13"]
build-backend = "uv_build"
