<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clusters · {{ name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
      }
    </script>
    <style>
      #tooltip img { max-width: 160px; max-height: 160px; }
      details > summary { list-style: none; }
      details > summary::-webkit-details-marker { display: none; }
      details[open] > summary .chevron { transform: rotate(90deg); }
    </style>
  </head>
  <body class="h-screen flex overflow-hidden bg-neutral-100 text-neutral-900">
    <aside class="w-96 shrink-0 flex flex-col border-r border-neutral-300 bg-white">
      <header class="p-3 border-b border-neutral-200 space-y-2">
        <div>
          <h1 class="font-semibold truncate" title="{{ name }}">{{ name }}</h1>
          <p class="text-xs text-neutral-500">
            {{ meta.model }} · {{ "{:,}".format(meta.rows) }} images · {{ meta.created }}
          </p>
        </div>
        <div class="flex gap-4 text-sm">
          <label class="flex gap-1 items-center"><input type="checkbox" id="show-images" /> images</label>
        </div>
        <div id="soft-controls" class="hidden text-sm">
          <label class="flex gap-1 items-center" title="move noise images into their strongest cluster when its score is high enough">
            <input type="checkbox" id="soft-on" /> soft assignment
          </label>
          <div class="flex items-center gap-2">
            <input type="range" id="soft-threshold" min="0" max="1" step="0.01" value="0.5" class="flex-1" />
            <span id="soft-value" class="w-10 text-xs text-right tabular-nums text-neutral-600"></span>
          </div>
        </div>
        <input id="filter" type="search" placeholder="filter clusters and groups"
          class="w-full border border-neutral-300 rounded px-2 py-1 text-sm" />
      </header>

      <div class="flex-1 overflow-y-auto">
        <section>
          <h2 class="px-3 pt-3 pb-1 text-xs font-semibold uppercase tracking-wide text-neutral-500">Groups</h2>
          <ul id="groups" class="divide-y divide-neutral-100"></ul>
          <p id="no-groups" class="px-3 pb-2 text-xs text-neutral-400">
            No groups yet: tick some clusters, then "+ group".
          </p>
        </section>
        <section>
          <h2 class="px-3 pt-3 pb-1 text-xs font-semibold uppercase tracking-wide text-neutral-500">Clusters</h2>
          <ul id="clusters" class="divide-y divide-neutral-100"></ul>
        </section>
      </div>

      <div id="selection-bar" class="hidden relative border-t border-neutral-200 p-2 flex gap-2 items-center text-sm">
        <span id="selection-count" class="flex-1 text-neutral-600"></span>
        <button id="add-group" class="px-2 py-1 rounded bg-neutral-900 text-white">+ group</button>
        <button id="clear-selection" class="px-2 py-1 rounded border border-neutral-300">clear</button>
        <div id="group-picker" class="hidden absolute bottom-full left-2 right-2 mb-1 bg-white border border-neutral-300 rounded shadow-lg p-2">
          <input id="group-search" placeholder="find or create a group"
            class="w-full border border-neutral-300 rounded px-2 py-1 text-sm" />
          <ul id="group-options" class="mt-1 max-h-60 overflow-y-auto"></ul>
        </div>
      </div>
    </aside>

    <main id="view" class="relative flex-1 bg-neutral-900">
      <div id="loading" class="absolute inset-0 flex items-center justify-center text-neutral-400">loading points…</div>
      <div id="tooltip" class="hidden absolute z-10 pointer-events-none bg-white rounded shadow p-1 text-xs"></div>

      <section id="pane" class="hidden absolute inset-x-0 bottom-0 h-80 max-h-[55%] flex flex-col bg-white border-t border-neutral-300">
        <div class="flex items-center gap-3 px-3 py-2 border-b border-neutral-200">
          <span id="pane-swatch" class="w-3 h-3 rounded-full shrink-0"></span>
          <span id="pane-kind" class="text-sm font-mono text-neutral-500"></span>
          <input id="pane-name" class="flex-1 min-w-24 bg-transparent border border-transparent hover:border-neutral-300 focus:border-neutral-400 rounded px-1 font-semibold" />
          <span id="pane-state" class="w-4 text-xs"></span>
          <button id="delete-group" class="hidden shrink-0 whitespace-nowrap px-2 py-1 text-sm rounded border border-red-300 text-red-700">delete group</button>
          <button id="deselect" class="shrink-0 whitespace-nowrap px-2 py-1 text-sm rounded border border-neutral-300">deselect</button>
        </div>
        <div id="pane-facts" class="flex flex-wrap gap-x-5 gap-y-1 items-center px-3 py-2 text-xs text-neutral-600"></div>
        <!-- nothing in front of the slider changes size, so it stays under the pointer -->
        <div id="pane-soft" class="hidden flex items-center gap-2 px-3 pb-2 text-xs text-neutral-600">
          <span class="shrink-0">soft threshold</span>
          <input id="pane-soft-slider" type="range" min="0" max="1" step="0.01" class="w-48 shrink-0" />
          <span id="pane-soft-value" class="w-24 shrink-0 font-medium text-neutral-900 tabular-nums"></span>
          <button id="pane-soft-reset" class="w-20 shrink-0 text-left underline hover:text-neutral-900">use global</button>
        </div>
        <div id="pane-samples" class="flex-1 min-h-0 flex gap-2 overflow-x-auto px-3 pb-2"></div>
        <div id="pane-joined" class="hidden flex-1 min-h-0 flex flex-col px-3 pb-2">
          <p id="pane-joined-caption" class="text-xs text-neutral-500 pb-1"></p>
          <div id="pane-joined-samples" class="flex-1 min-h-0 flex gap-2 overflow-x-auto"></div>
        </div>
      </section>
    </main>

    <template id="cluster-item">
      <li class="px-3 py-2">
        <div class="select flex items-center gap-2 cursor-pointer">
          <input type="checkbox" class="check shrink-0" title="select for a group" />
          <button class="eye shrink-0 text-neutral-500 hover:text-neutral-900" title="show or hide in the view"></button>
          <span class="swatch w-3 h-3 rounded-full shrink-0"></span>
          <span class="id w-10 text-sm font-mono text-neutral-500"></span>
          <input class="name flex-1 min-w-0 bg-transparent border border-transparent hover:border-neutral-300 focus:border-neutral-400 rounded px-1 text-sm"
            placeholder="unnamed" />
          <span class="state w-4 text-xs"></span>
          <span class="size text-xs text-neutral-500 tabular-nums"></span>
        </div>
        <details class="mt-1">
          <summary class="text-xs text-neutral-500 cursor-pointer select-none">
            <span class="chevron inline-block transition-transform">▸</span> samples
          </summary>
          <div class="samples grid grid-cols-4 gap-1 mt-1"></div>
        </details>
      </li>
    </template>

    <script type="module" src="{{ url_for('static', filename='viewer.js') }}"></script>
  </body>
</html>
