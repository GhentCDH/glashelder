[project]
name = "cluster"
version = "0.1.0"
description = "Cluster images using machine learned embeddings."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "common",
  "embed",
  "numpy>=2.2.3",
  "rich>=13.9.4",
  "scikit-learn>=1.6.1",
  "scipy>=1.17.0",
  "python-dotenv>=1.1.0",
  "umap-learn>=0.5.11",
  "hdbscan>=0.8.40",
  "matplotlib>=3.10.7",
  "click>=8.3.1",
  "flask>=3.1.2",
  "rerun-sdk[notebook]>=0.27.2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "pyarrow>=23.0.0",
  "typst>=0.15.0",
]

[build-system]
requires = ["uv_build>=0.9.14,<0.13"]
build-backend = "uv_build"
