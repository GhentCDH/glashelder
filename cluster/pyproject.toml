[project]
name = "cluster"
version = "0.1.0"
description = "Cluster images using machine learned embeddings."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "common",
  "numpy>=2.2.3",
  "opencv-python>=4.11.0.86",
  "pillow>=11.1.0",
  "rich>=13.9.4",
  "scikit-image>=0.25.2",
  "scikit-learn>=1.6.1",
  "transformers>=4.57.0",
  "python-dotenv>=1.1.0",
  "torch>=2.6.0",
  "torchvision>=0.24.0",
  "tensorboard>=2.19.0",
  "toml>=0.10.2",
  "numba>=0.63.1",
  "umap-learn>=0.5.11",
  "hdbscan>=0.8.40",
  "matplotlib>=3.10.7",
  "click>=8.3.1",
  "flask>=3.1.2",
  "anywidget[dev]>=0.9.21",
  "jupyter>=1.1.1",
  "rerun-sdk[notebook]>=0.27.2; sys_platform != 'darwin' or platform_machine != 'x86_64'",
  "qwen-vl-utils>=0.0.14",
  "pyarrow>=23.0.0",
  "typst>=0.15.0",
]

[tool.uv.sources]
common = { workspace = true }

[dependency-groups]
dev = ["pyright>=1.1.406"]

[tool.pyright]
typeCheckingMode = "basic"
venv = ".venv"
venvPath = "."

[build-system]
requires = ["uv_build>=0.9.14,<0.10.0"]
build-backend = "uv_build"
