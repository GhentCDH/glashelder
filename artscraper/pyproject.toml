[project]
name = "artscraper"
version = "0.1.0"
description = "Async scraper for getting an index of externally described artworks to match to."
readme = "README.md"
authors = [{ name = "Miel Peeters", email = "peetersmiel@gmail.com" }]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.12",
    "click>=8.3.1",
    "httpx>=0.27",
    "rich>=13.9.4",
    "zstandard>=0.25.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
