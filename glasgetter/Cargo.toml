[package]
name = "glasgetter"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.10"
clap = { version = "4.5.58", features = ["derive"] }
futures = "0.3.31"
indicatif = "0.18.3"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls"] }
scraper = "0.25.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1.49.0", features = ["rt", "macros", "time"] }
